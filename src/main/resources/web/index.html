<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="form-container">
        <h2>Login</h2>
        <div class="input-box">
            <input id="user" type="text" placeholder="">
            <span>Username</span>
        </div>
        <div class="input-box">
            <input id="pass" type="password" placeholder="">
            <span>Password</span>
        </div>
        <button id="btnLogin" class="submit-btn">Login</button>
        <div id="msg"></div>
    </div>
    <div class="wrapper">
        <header>
            <div id="hambIcon" class="hamb-icon">
                &#9776;
            </div>
        </header>
        <nav id="menu">
            <a href="#">Home</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
            <a href="#">About</a>
        </nav>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

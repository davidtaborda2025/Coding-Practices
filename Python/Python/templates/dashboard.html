<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Auditoria</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .card {
            background-color: #1e1e1e;
            display: inline-block;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
        }
        h1 { color: #2ecc71; }

        #welcome-toast {
            visibility: hidden;
            min-width: 280px;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            color: white;
            text-align: center;
            border-radius: 12px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            right: 30px;
            top: 30px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: visibility 0s, opacity 0.5s linear;
            opacity: 0;
        }

        /* noinspection CssUnusedSymbol */
        #welcome-toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="welcome-toast"></div>

    <div class="card">
        <h1>Análisis de Intentos de Login</h1>
        <p>Datos procesados en tiempo real con R y PostgreSQL</p>
        <img src="/static/reporte_auditoria.png" alt="Gráfica de Auditoría">
    </div>
    <script>
        function refrescarGrafica() {
            const img = document.querySelector('img[alt="Gráfica de Auditoría"]');
            if (img) {
                const timestamp = new Date().getTime();
                img.src = "/static/reporte_auditoria.png?v=" + timestamp;
                console.log("Solicitando imagen fresca al servidor: v=" + timestamp);
            } else {
                console.error("No se encontró la imagen para actualizar.");
            }
        }

        window.onload = function() {
            console.log("Página cargada o F5 detectado. Forzando refresco inicial...");
            refrescarGrafica();

            const urlParams = new URLSearchParams(window.location.search);
            const usuario = urlParams.get('user');

            if (usuario) {
                const toast = document.getElementById("welcome-toast");
                toast.innerText = "¡Bienvenido, " + usuario + "! Autenticado correctamente.";
                toast.classList.add("show");
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 4000);
            }
        };

        setInterval(refrescarGrafica, 10000);

        console.log("Sistema de auto-refresco (F5 + Ciclo) activo.");
    </script>
</body>
</html>
